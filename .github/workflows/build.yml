name: Build & Test

on:
  push:
    branches: [main]
    # Tags too. publish.yml gates only on `dotnet test`, so before this a tag push skipped the
    # non-invariant-culture leg, the dev-host compile, the SQL Server migration/idempotency check and
    # the schema verification — every one of which exists to catch something the unit tests cannot,
    # and all of which matter most on the commit that is about to become a release nobody can unpublish.
    tags: ['v*', 'cms12-v*']
  pull_request:
    branches: [main]

# Least privilege. Without this the job inherits the repository default, which on older repositories
# is read/write over contents, packages and issues — handed to every build-time tool this job installs.
permissions:
  contents: read

# Supersede an in-flight run for the same branch or pull request: unlike publish, nothing here has an
# irreversible side effect, so the newest commit is the only one whose result matters.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Bounded for the same reason as publish: this job waits on SQL Server, two tool installs and
    # SonarCloud. The readiness loops inside it are bounded; the job itself was not.
    timeout-minutes: 30

    services:
      # Real SQL Server for the migration checks at the end of this job. Native amd64 on GitHub's
      # runners, so it starts far quicker here than under emulation on an Apple Silicon dev machine.
      # Throwaway credentials for a container that lives and dies with the job.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Episerver123!
        ports:
          - 1433:1433

    env:
      MSSQL_SA_PASSWORD: Episerver123!
      SQLSERVER_IMAGE: mcr.microsoft.com/mssql/server:2022-latest
      SJI_CI_DATABASE: ScheduledJobsInsightsCi
      # Hoisted to the job so one expression decides whether the Sonar steps can run — see the
      # comment above "Set up JDK 17". Empty rather than absent when unavailable, which is what the
      # guards test.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          # Restores from cache rather than re-downloading the whole graph every run. Also removes a
          # hard dependency on nuget.org being reachable at release time, which previously could fail a
          # publish *after* tests and pack had already succeeded.
          cache: true
          # The .props files too: both packages and both test projects take their package versions
          # from src/Package.props and tests/Tests.props, so a bump there changes the restore graph.
          cache-dependency-path: |
            **/*.csproj
            **/*.props

      # Sonar only runs when a token is actually available, which is the real precondition and covers
      # three cases at once:
      #
      #   - A pull request from a fork. GitHub withholds secrets from those entirely.
      #   - A Dependabot pull request. These run against the *Dependabot* secrets store rather than the
      #     Actions one, so an Actions-only SONAR_TOKEN is empty even though the branch lives in this
      #     repository — which is why guarding on head.repo.full_name did not catch them. The scanner
      #     then failed with "The format of the analysis property sonar.token= is invalid".
      #   - A clone or fork where nobody has configured SonarCloud.
      #
      # In all three the job still builds and runs the tests; only the analysis is skipped. Guarding on
      # the actor instead would have to be re-guessed every time a new bot appears.
      - name: Note that SonarCloud analysis is skipped
        if: ${{ env.SONAR_TOKEN == '' }}
        # Folded, so the wrapped source collapses to single spaces. A backslash-continued string here
        # would keep the YAML indentation as runs of spaces inside the message itself.
        run: >-
          echo "::notice title=SonarCloud analysis skipped::No SONAR_TOKEN is available to this run
          (a fork pull request, a Dependabot pull request, or a repository with no SonarCloud setup).
          The build and the full test suite still ran; only the static analysis was skipped."

      - name: Set up JDK 17
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Install SonarScanner
        if: ${{ env.SONAR_TOKEN != '' }}
        run: dotnet tool install --global dotnet-sonarscanner --version 10.4.0

      - name: Restore
        run: dotnet restore src/OptiPowerTools.ScheduledJobsInsights/OptiPowerTools.ScheduledJobsInsights.csproj

      - name: Restore Tests
        run: dotnet restore tests/OptiPowerTools.ScheduledJobsInsights.Tests/OptiPowerTools.ScheduledJobsInsights.Tests.csproj

      - name: Extract version from csproj
        id: version
        run: |
          set -euo pipefail

          # The tag is the source of truth for a release (publish.yml derives the package version from
          # it), so the analysis version comes from the same place. Reading <Version> out of the csproj
          # meant every post-1.0 analysis was labelled with whatever prerelease string happened to be
          # committed there — permanently 1.0.0-rc.1, since the release workflow overrides it and never
          # writes it back.
          # --match: the CMS 12 package is tagged cms12-v*, and the analysis is of the CMS 13 one.
          VERSION="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//' || true)"

          if [ -z "$VERSION" ]; then
            # No tags yet: fall back to the csproj so this still says something before the first release.
            VERSION="$(grep '<Version>' src/OptiPowerTools.ScheduledJobsInsights/OptiPowerTools.ScheduledJobsInsights.csproj | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')"
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Analysis version $VERSION"

      # Three exclusions below, all deliberate:
      #   sub/**              - the MyOptiAlloySite submodule is a separate repository with its own
      #                         analysis. Its dockerfiles, SCSS and Alloy views are not this package's
      #                         code and cannot be fixed from here.
      #   src/…Cms12.Web/**   - the CMS 12 dev host is Optimizely's Alloy template, kept as generated,
      #                         for the same reason. Sonar indexes non-C# files from the whole tree, so
      #                         leaving it out of the build below is not enough to keep its views and
      #                         vendored bootstrap out of the analysis.
      #   **/Data/Migrations/ - generated by `dotnet ef migrations add`. Hand-editing them to satisfy a
      #                         style rule would be undone by the next regeneration, and they are not
      #                         unit-tested by design: the Verify steps at the end of this job apply
      #                         them to a real SQL Server and assert the resulting schema, which is
      #                         stronger coverage than a unit test of generated DDL would be.
      - name: Begin SonarCloud Analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          dotnet-sonarscanner begin \
            /k:"szolkowski_OptiPowerTools.ScheduledJobsInsights" \
            /o:"szolkowski" \
            /v:"${{ steps.version.outputs.value }}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx" \
            /d:sonar.exclusions="sub/**,src/OptiPowerTools.ScheduledJobsInsights.Cms12.Web/**,**/Data/Migrations/**" \
            /d:sonar.coverage.exclusions="**/Data/Migrations/**"

      - name: Build
        run: dotnet build src/OptiPowerTools.ScheduledJobsInsights/OptiPowerTools.ScheduledJobsInsights.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/OptiPowerTools.ScheduledJobsInsights.Tests/OptiPowerTools.ScheduledJobsInsights.Tests.csproj -c Release --logger "trx" --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      # Every number and timestamp this package renders is a diagnostic, compared between environments
      # and pasted into tickets, so all of it is formatted with InvariantCulture and CA1305 is promoted
      # to an error to enforce that. But CA1305 does not see interpolated strings — verified — so a
      # `$"{x:N0}"` slipping into a component would format as "310,99 ms" for a German-locale host with
      # nothing failing. This leg is the runtime backstop for the hole the analyser admits to.
      #
      # Outside the Sonar coverage run on purpose: it is the same tests a second time, and duplicate
      # coverage data would only confuse the report.
      - name: Test under a non-invariant culture
        env:
          DOTNET_SYSTEM_GLOBALIZATION_PREDEFINED_CULTURES_ONLY: 'false'
          LANG: de_DE.UTF-8
          LC_ALL: de_DE.UTF-8
        run: dotnet test tests/OptiPowerTools.ScheduledJobsInsights.Tests/OptiPowerTools.ScheduledJobsInsights.Tests.csproj -c Release --no-build

      - name: End SonarCloud Analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Pack
        run: dotnet pack src/OptiPowerTools.ScheduledJobsInsights/OptiPowerTools.ScheduledJobsInsights.csproj --no-build -c Release

      # The dev host and its sample jobs are not packaged, but they are the only thing that compiles
      # the package the way a consumer does — against a real Optimizely CMS host. Without this a break
      # in the samples, or in the public surface they exercise, ships unnoticed.
      #
      # Deliberately after the SonarCloud analysis rather than inside it: this project is dev-only and
      # intentionally untested, so folding it into the scan would drag coverage down for code nothing
      # is meant to cover. Needs the Alloy submodule, which the checkout above already fetches.
      - name: Build dev host and sample jobs
        run: dotnet build src/OptiPowerTools.ScheduledJobsInsights.Web/OptiPowerTools.ScheduledJobsInsights.Web.csproj -c Release

      # --- The CMS 12 package ---------------------------------------------------------------------
      # Compiled from the same source tree as the CMS 13 package (it links that project's files, with
      # CMS12 defined), so it has to be built and tested on its own: a change that is fine on CMS 13 can
      # still break the CMS 12 build, and nothing above would notice.
      #
      # After the SonarCloud analysis, like the dev host: the linked files are the CMS 13 project's own,
      # and building them a second time inside the scan would index every one of them twice. Also outside
      # the non-invariant-culture leg - the formatting code is the same source, already covered above.
      - name: Test the CMS 12 package
        run: dotnet test tests/OptiPowerTools.ScheduledJobsInsights.Cms12.Tests/OptiPowerTools.ScheduledJobsInsights.Cms12.Tests.csproj -c Release

      # The package is assembled from linked items, so a glob that stops matching drops files from the
      # nupkg without failing anything: the package would install and its pages would render unstyled,
      # or not at all. Asserting the shape of the package is the only thing that catches that.
      - name: Pack the CMS 12 package and check its contents
        run: |
          set -euo pipefail
          dotnet pack src/OptiPowerTools.ScheduledJobsInsights.Cms12/OptiPowerTools.ScheduledJobsInsights.Cms12.csproj --no-build -c Release -o ./nupkg-cms12
          nupkg="$(ls ./nupkg-cms12/OptiPowerTools.ScheduledJobsInsights.Cms12.*.nupkg | grep -v '\.snupkg$')"
          unzip -l "$nupkg" > /tmp/cms12-contents.txt
          missing=0
          for entry in \
            lib/net10.0/OptiPowerTools.ScheduledJobsInsights.Cms12.dll \
            lib/net10.0/OptiPowerTools.ScheduledJobsInsights.Cms12.xml \
            staticwebassets/css/scheduled-jobs-insights.css \
            staticwebassets/js/timezone.js \
            staticwebassets/js/detail-interop.js \
            README.md icon.png LICENSE.txt; do
            grep -q " $entry\$" /tmp/cms12-contents.txt || { echo "::error::$entry is missing from $nupkg"; missing=1; }
          done
          grep -qE ' staticwebassets/OptiPowerTools\.ScheduledJobsInsights\.Cms12\.[a-z0-9]+\.bundle\.scp\.css$' /tmp/cms12-contents.txt \
            || { echo "::error::the scoped CSS bundle is missing from $nupkg"; missing=1; }
          [ "$missing" -eq 0 ] || { cat /tmp/cms12-contents.txt; exit 1; }
          echo "$nupkg has every expected entry."

      - name: Build the CMS 12 dev host
        run: dotnet build src/OptiPowerTools.ScheduledJobsInsights.Cms12.Web/OptiPowerTools.ScheduledJobsInsights.Cms12.Web.csproj -c Release

      # --- Migrations against real SQL Server ---------------------------------------------------
      # Nothing else verifies these. The EF tests run on Sqlite, and OnModelCreating deliberately
      # swaps in a DateTimeOffset converter for that provider, so descending index keys,
      # nvarchar(max), the custom schema and the cascade rules are never exercised by the suite.
      #
      # Deliberately the last thing in the job: the service container has been warming since the job
      # started, so by now the readiness check below almost always passes on its first attempt.
      - name: Wait for SQL Server
        run: |
          set -euo pipefail
          cid=$(docker ps --filter "ancestor=$SQLSERVER_IMAGE" --format '{{.ID}}' | head -1)
          if [ -z "$cid" ]; then
            echo "SQL Server service container not found."; docker ps; exit 1
          fi
          echo "SQLSERVER_CID=$cid" >> "$GITHUB_ENV"

          # Polled rather than declared as a service health-cmd: the image's sqlcmd path has moved
          # between versions, and a wrong health-cmd fails the job with no useful diagnostics.
          for _ in $(seq 1 60); do
            if docker exec "$cid" /opt/mssql-tools18/bin/sqlcmd \
                 -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is accepting connections."; exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready in time."; docker logs "$cid" | tail -50; exit 1

      - name: Apply migrations to SQL Server
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet tool install --global dotnet-ef --version 10.0.2

          connection="Server=localhost,1433;Database=$SJI_CI_DATABASE;User Id=sa;Password=$MSSQL_SA_PASSWORD;TrustServerCertificate=True;Encrypt=False;"
          apply() {
            dotnet ef database update \
              --project src/OptiPowerTools.ScheduledJobsInsights \
              --context OptiPowerTools.ScheduledJobsInsights.Data.ScheduledJobsInsightsDbContext \
              --connection "$connection"
          }

          echo "::group::Applying migrations to an empty database"
          apply
          echo "::endgroup::"

          # Re-applying must change nothing. A migration that is not idempotent breaks every existing
          # installation on upgrade, and UseOptiPowerToolsScheduledJobsInsights runs Migrate() on every
          # single startup.
          echo "::group::Re-applying (must be a no-op)"
          apply | tee /tmp/second-apply.log
          echo "::endgroup::"
          grep -q "No migrations were applied" /tmp/second-apply.log \
            || { echo "Re-applying migrations was not a no-op."; exit 1; }

      - name: Verify the applied schema
        run: |
          set -euo pipefail
          docker exec -i "$SQLSERVER_CID" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -d "$SJI_CI_DATABASE" \
            < .github/sql/verify-schema.sql

      # A site moving from CMS 12 to CMS 13 swaps the CMS 12 package for the CMS 13 one and keeps its
      # database. That only preserves its execution history if the CMS 13 package recognises every
      # migration the CMS 12 one applied, and has nothing left to apply. Both packages compile the same
      # migration sources, so this holds by construction today; this step is what notices the day it
      # stops holding - a migration added behind #if, or to one project only.
      - name: Verify the CMS 12 to CMS 13 upgrade path
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"

          database="${SJI_CI_DATABASE}Upgrade"
          connection="Server=localhost,1433;Database=$database;User Id=sa;Password=$MSSQL_SA_PASSWORD;TrustServerCertificate=True;Encrypt=False;"
          apply() {
            dotnet ef database update \
              --project "$1" \
              --context OptiPowerTools.ScheduledJobsInsights.Data.ScheduledJobsInsightsDbContext \
              --connection "$connection"
          }

          echo "::group::Applying the CMS 12 package's migrations to an empty database"
          apply src/OptiPowerTools.ScheduledJobsInsights.Cms12
          echo "::endgroup::"

          echo "::group::Applying the CMS 13 package's migrations on top (must be a no-op)"
          apply src/OptiPowerTools.ScheduledJobsInsights | tee /tmp/upgrade-apply.log
          echo "::endgroup::"
          grep -q "No migrations were applied" /tmp/upgrade-apply.log \
            || { echo "::error::The CMS 13 package applied migrations to a CMS 12 database, so a site upgrading CMS would not keep its schema as-is."; exit 1; }

          docker exec -i "$SQLSERVER_CID" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -d "$database" \
            < .github/sql/verify-schema.sql
