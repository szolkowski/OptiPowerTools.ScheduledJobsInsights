name: Publish NuGet

# Tagging is the release. The tag is the single source of the version — the csproj's <Version> is
# only what a local `dotnet pack` produces, and shipping that by accident is how v1.0.0 would have
# published a package stamped 0.9.5.
#
# Two packages publish from this one workflow, told apart by the tag: `v1.2.3` releases
# OptiPowerTools.ScheduledJobsInsights (CMS 13), `cms12-v1.2.3` releases
# OptiPowerTools.ScheduledJobsInsights.Cms12. One file rather than two near-copies, so the guards
# below cannot drift apart between the packages, and because nuget.org's trusted publishing policy
# names the workflow file: a second file would need a second policy.
#
# A dry run (Actions → Publish NuGet → Run workflow) does everything except the two irreversible
# steps. It exists because nuget.org packages cannot be deleted — only unlisted — so the first real
# tag should not also be the first test of this pipeline. The OIDC exchange *is* exercised: getting a
# temporary key back proves the trusted publishing policy, the NUGET_USER secret and the id-token
# permission are all correct, which is the only part that cannot be checked locally.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*', 'cms12-v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to build (dry run only)'
        required: true
        type: choice
        options: [cms13, cms12]
        default: cms13
      version:
        description: 'Version to build (dry run only, e.g. 1.0.0-rc.1)'
        required: true
        default: '1.0.0-rc.1'

env:
  MSSQL_SA_PASSWORD: Episerver123!
  SQLSERVER_IMAGE: mcr.microsoft.com/mssql/server:2022-latest

# One publish at a time, and never cancelled part-way: a run that has already pushed to nuget.org
# cannot be undone, so the second tag waits rather than racing it. Without this, two tags a minute
# apart both minted OIDC keys and raced `dotnet nuget push`, where --skip-duplicate made the loser
# silently succeed.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    # Bounded, because everything here waits on something external — SQL Server coming up, two tool
    # installs, an OIDC exchange. Unbounded, a wedged step burns to GitHub's 6-hour default on the
    # maintainer's own Actions minutes.
    timeout-minutes: 30

    # This repository only. A fork that tags a release would otherwise start a publish it cannot
    # finish, failing at the OIDC exchange with an error that looks like a broken pipeline.
    if: github.repository == 'szolkowski/OptiPowerTools.ScheduledJobsInsights'

    permissions:
      # Trusted Publishing: GitHub mints a short-lived OIDC token, nuget.org validates it against the
      # registered policy and hands back a temporary API key. No long-lived secret to store or rotate.
      id-token: write
      contents: write

    services:
      # Used only to prove the shipped migration script applies. Same image, credentials and shape as
      # build.yml's, deliberately: two workflows disagreeing about how they stand up SQL Server is a
      # maintenance trap. Throwaway container that lives and dies with the job.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Episerver123!
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          # Restores from cache rather than re-downloading the whole graph every run. Also removes a
          # hard dependency on nuget.org being reachable at release time, which previously could fail a
          # publish *after* tests and pack had already succeeded.
          cache: true
          cache-dependency-path: '**/*.csproj'

      # Every ${{ … }} that reaches a shell arrives through env rather than being pasted into the
      # script text. inputs.version is supplied by whoever dispatches the workflow, and expanding it
      # inline would let them close the quote and run their own commands — in a job holding an OIDC
      # identity that can publish to nuget.org.
      - name: Resolve package and version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PACKAGE="$INPUT_PACKAGE"
            VERSION="$INPUT_VERSION"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            # Longest prefix first: a cms12- tag must never be read as a v tag.
            case "$REF_NAME" in
              cms12-v*) PACKAGE=cms12; VERSION="${REF_NAME#cms12-v}" ;;
              v*)       PACKAGE=cms13; VERSION="${REF_NAME#v}" ;;
              *) echo "::error::Tag '$REF_NAME' names no package (expected v* or cms12-v*)."; exit 1 ;;
            esac
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

          # Everything that differs between the two packages, decided once here. Unknown values stop
          # the run, which is also what keeps INPUT_PACKAGE from reaching a shell anywhere below.
          case "$PACKAGE" in
            cms13)
              {
                echo "project=src/OptiPowerTools.ScheduledJobsInsights/OptiPowerTools.ScheduledJobsInsights.csproj"
                echo "tests=tests/OptiPowerTools.ScheduledJobsInsights.Tests/OptiPowerTools.ScheduledJobsInsights.Tests.csproj"
                echo "readme=README.md"
                echo "script_name=scheduled-jobs-insights"
                echo "tag_prefix=v"
              } >> "$GITHUB_OUTPUT"
              ;;
            cms12)
              {
                echo "project=src/OptiPowerTools.ScheduledJobsInsights.Cms12/OptiPowerTools.ScheduledJobsInsights.Cms12.csproj"
                echo "tests=tests/OptiPowerTools.ScheduledJobsInsights.Cms12.Tests/OptiPowerTools.ScheduledJobsInsights.Cms12.Tests.csproj"
                echo "readme=README.md"
                echo "script_name=scheduled-jobs-insights-cms12"
                echo "tag_prefix=cms12-v"
              } >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::'$PACKAGE' is not a package (expected cms13 or cms12)."; exit 1 ;;
          esac
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

          # Also the gate that makes the value safe downstream: everything after this point is known
          # to match SemVer, so it cannot carry shell metacharacters.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a SemVer version (expected MAJOR.MINOR.PATCH[-prerelease])."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # What the README's absolute links are pinned to. A real tag push pins to the tag; a dry run
          # has no tag, so it pins to the commit, which raw.githubusercontent resolves just as well and
          # which keeps the dry run's package a faithful rehearsal.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

          echo "Package $PACKAGE, version $VERSION"

      # A tag can point at any commit, including one that never passed CI — build.yml runs on
      # pushes and pull requests to main, not on tags. Gating here is what stops a red build
      # reaching a feed that cannot be unpublished.
      - name: Test
        env:
          TESTS: ${{ steps.version.outputs.tests }}
        run: dotnet test "$TESTS" -c Release

      # The API-compatibility baseline cannot be armed until there is a published release to compare
      # against, so 1.0.0 necessarily ships without it — PublicSurfaceTests covers that one release.
      # Every version after it has no such excuse, and forgetting the property is silent: the pack
      # simply performs no API comparison and nobody finds out until a consumer's build breaks.
      - name: Require an API baseline for post-1.0.0 releases
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PROJECT_FILE: ${{ steps.version.outputs.project }}
        run: |
          set -euo pipefail

          # Only the 1.0.0 line is exempt, prereleases of it included - for each package, since each
          # establishes its own baseline with its first release.
          case "$VERSION" in
            1.0.0|1.0.0-*)
              echo "Version $VERSION establishes the baseline; no comparison possible yet."
              exit 0
              ;;
          esac

          if ! grep -qE '^[^<]*<PackageValidationBaselineVersion>' "$PROJECT_FILE"; then
            echo "::error::$VERSION is past 1.0.0 but PackageValidationBaselineVersion is not set in $PROJECT_FILE, so this package ships with no API-compatibility check. Uncomment it and set it to the previous released version."
            exit 1
          fi

          echo "API baseline: $(grep -oE '<PackageValidationBaselineVersion>[^<]+' "$PROJECT_FILE" | cut -d'>' -f2)"

      # nuget.org renders the packed README on its own, with no repository around it: a relative
      # `images/...` path resolves to nothing and every screenshot becomes a broken-image icon, on the
      # one page most people will ever see. The images are not in the package either — only the icon
      # is — so the links have to be absolute.
      #
      # Rewritten here rather than committed absolute, so the in-repo README keeps working on GitHub
      # and stays diffable. Pinned to the tag, never to a branch: a screenshot changed later must not
      # retroactively alter the page of a version already shipped.
      - name: Make README links absolute for nuget.org
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          # The file the chosen package packs as its README.
          README: ${{ steps.version.outputs.readme }}
        run: |
          set -euo pipefail
          RAW="https://raw.githubusercontent.com/$REPO/$TAG"
          BLOB="https://github.com/$REPO/blob/$TAG"

          # GNU sed, so bare -i is correct (on BSD/macOS it would need an explicit ''). Verified by
          # running these three substitutions against the real README before this was committed.
          sed -i "s|](images/|]($RAW/images/|g" "$README"
          sed -i "s|](LICENSE.txt)|]($BLOB/LICENSE.txt)|g" "$README"
          sed -i "s|](CONTRIBUTING.md)|]($BLOB/CONTRIBUTING.md)|g" "$README"
          sed -i "s|](CHANGELOG.md)|]($BLOB/CHANGELOG.md)|g" "$README"
          sed -i "s|](CODE_OF_CONDUCT.md)|]($BLOB/CODE_OF_CONDUCT.md)|g" "$README"
          sed -i "s|](SECURITY.md)|]($BLOB/SECURITY.md)|g" "$README"

          echo "Rewritten link targets:"
          grep -nE "!\[|\]\(https://github.com/$REPO/blob/" "$README" || true

          # Fail loudly rather than shipping a page with a broken image on it.
          #
          # Deliberately generic: anything that is not an absolute URL, an in-page anchor or a mailto
          # is relative, and relative resolves to nothing on nuget.org. Listing the known filenames
          # instead — as this did — silently stopped covering the page the moment somebody linked a
          # file nobody had thought to add to the list.
          if grep -nP '\]\((?!https?://|#|mailto:)' "$README"; then
            echo "::error::The links printed above are relative and would render broken on nuget.org. Add a rewrite rule for them in this step."
            exit 1
          fi

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PROJECT: ${{ steps.version.outputs.project }}
        run: dotnet pack "$PROJECT" -c Release -o ./nupkg -p:Version="$VERSION"

      # Shipped for hosts that set AutoMigrateDatabase=false, whose app-pool identity often lacks
      # DDL rights. Idempotent, so it is safe to re-run against a database at any migration level.
      - name: Generate idempotent migration script
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PROJECT: ${{ steps.version.outputs.project }}
          SCRIPT_NAME: ${{ steps.version.outputs.script_name }}
        run: |
          set -euo pipefail
          # A globally installed tool is not on PATH in a fresh shell; without this `dotnet ef` below
          # is "command not found". build.yml does the same.
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Pinned: an unpinned tool install lets a tool release change release-pipeline behaviour
          # between two runs of the same tag.
          dotnet tool install --global dotnet-ef --version 10.0.2

          SCRIPT="./nupkg/$SCRIPT_NAME-$VERSION.sql"
          dotnet ef migrations script --idempotent \
            --project "$PROJECT" \
            --context OptiPowerTools.ScheduledJobsInsights.Data.ScheduledJobsInsightsDbContext \
            --output "$SCRIPT"
          # dotnet ef writes a UTF-8 BOM, and sqlcmd reports "Incorrect syntax near ''" on the very
          # first line because of it unless invoked with -f 65001. Stripping it here means the script
          # just runs — in sqlcmd, SSMS or Azure Data Studio alike.
          sed -i '1s/^\xEF\xBB\xBF//' "$SCRIPT"

      # The script is what a consumer runs when AutoMigrateDatabase is false, so shipping one that
      # does not apply would be worse than shipping none. Verified twice over: once against an empty
      # database, once more to prove it is genuinely idempotent, then checked against the expected
      # schema. This also guards the BOM strip above — without it sqlcmd fails on the first line.
      - name: Verify the shipped script applies
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SCRIPT_NAME: ${{ steps.version.outputs.script_name }}
        run: |
          set -euo pipefail
          SCRIPT="./nupkg/$SCRIPT_NAME-$VERSION.sql"

          cid=$(docker ps --filter "ancestor=$SQLSERVER_IMAGE" --format '{{.ID}}' | head -1)
          if [ -z "$cid" ]; then
            echo "SQL Server service container not found."; docker ps; exit 1
          fi

          # Polled rather than a service health-cmd, for the same reason as build.yml: the image's
          # sqlcmd path has moved between versions and a wrong health-cmd fails with no diagnostics.
          for _ in $(seq 1 60); do
            docker exec "$cid" /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done

          docker exec "$cid" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -Q "CREATE DATABASE ScriptCheck;"

          for run in 1 2; do
            echo "::group::Applying the script (run $run)"
            docker exec -i "$cid" /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -d ScriptCheck < "$SCRIPT"
            echo "::endgroup::"
          done

          docker exec -i "$cid" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -d ScriptCheck \
            < .github/sql/verify-schema.sql

      # Deliberately the last step before the push: the temporary key is valid for one hour, and one
      # OIDC token buys exactly one key. Requesting it earlier risks it expiring behind a slow build.
      # Runs in a dry run too — obtaining a key is exactly the proof that the policy is correct, and
      # an unused key simply expires after its hour.
      - name: NuGet login (OIDC to short-lived key)
        # Pinned to a commit rather than a tag: a tag can be moved to point at different code, and
        # this step runs in a job that can publish to nuget.org. v1.2.0.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Everything above this line runs identically in a dry run. Everything below is irreversible:
      # a pushed version can be unlisted but never deleted, and a release is public the moment it
      # exists.
      - name: Dry run — stopping before publish
        if: steps.version.outputs.dry_run == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ steps.version.outputs.package }}
        run: |
          echo "### Dry run passed :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$PACKAGE\` version \`$VERSION\` packed, the migration script verified against SQL Server, and a short-lived NuGet key obtained over OIDC." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing was pushed. Tag the commit to publish for real." >> "$GITHUB_STEP_SUMMARY"
          ls -la ./nupkg

      - name: Push to NuGet.org
        if: steps.version.outputs.dry_run == 'false'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "./nupkg/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY"
          --skip-duplicate

      - name: Create GitHub Release
        if: steps.version.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          PACKAGE: ${{ steps.version.outputs.package }}
          TAG_PREFIX: ${{ steps.version.outputs.tag_prefix }}
        run: |
          set -euo pipefail
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi

          # The repository's "Latest" release stays the CMS 13 package's. GitHub otherwise marks
          # whichever release was created last, so every CMS 12 patch would take the badge.
          LATEST="--latest"
          [ "$PACKAGE" = "cms12" ] && LATEST="--latest=false"

          # Notes run from the previous release of the *same* package. Left to itself, --generate-notes
          # starts at the previous release of either package, so a CMS 12 patch would list everything
          # since the last CMS 13 release instead. A final release skips prereleases of its own line,
          # whose notes it already supersedes - tested after the prefix is stripped, because cms12-v
          # itself contains a hyphen. The checkout is shallow, so the tags come from the remote.
          PREVIOUS="$(git ls-remote --tags --refs origin "refs/tags/${TAG_PREFIX}[0-9]*" \
            | sed 's|.*refs/tags/||' \
            | grep -vxF "$TAG" \
            | sed "s|^${TAG_PREFIX}||" \
            | { if [[ "$VERSION" == *-* ]]; then cat; else grep -v -e '-'; fi; } \
            | { cat; echo "$VERSION"; } \
            | sort -V | grep -B1 -xF "$VERSION" | head -1 \
            | grep -vxF "$VERSION" || true)"
          if [ -n "$PREVIOUS" ]; then
            NOTES=(--generate-notes --notes-start-tag "${TAG_PREFIX}${PREVIOUS}")
          else
            # The first release of a package: there is no earlier tag of its own to start from.
            NOTES=(--notes "First release of this package.")
          fi
          echo "Release notes: ${NOTES[*]}"
          # Idempotent, so re-running a publish that failed after the push is not a red step. The push
          # above already tolerates a duplicate (--skip-duplicate); this is the same reasoning applied
          # to the release, which otherwise errors because the tag already has one.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets to it instead."
            gh release upload "$TAG" \
              ./nupkg/*.nupkg \
              ./nupkg/*.snupkg \
              ./nupkg/*.sql \
              --clobber
          else
            gh release create "$TAG" \
              ./nupkg/*.nupkg \
              ./nupkg/*.snupkg \
              ./nupkg/*.sql \
              --title "$TAG" \
              "${NOTES[@]}" \
              $LATEST \
              $PRERELEASE
          fi
